services:
  - type: web
    name: mathcounts-test-platform
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA_BASE64
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
